<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz San Valentín</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('https://i.pinimg.com/736x/b3/c8/c1/b3c8c10c6f01b1b1bf4d26a53871976c.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 0;
}

.main-content {
    text-align: center;
    padding: 80px 20px;
    min-height: 100vh;
    position: relative;
    z-index: 1;
}

h1 {
    font-family: 'Press Start 2P', cursive;
    font-size: 28px;
    margin-bottom: 40px;
    text-shadow: 4px 4px 0 #000;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 40px;
    max-width: 900px;
    margin: auto;
}

.chest {
    cursor: pointer;
    width: 130px;
    height: 130px;
    margin: auto;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

.chest-text {
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    margin-top: 10px;
    text-shadow: 2px 2px 0 #000;
}

.content-box {
    display: none;
    margin-top: 15px;
    font-family: Arial, sans-serif;
    background: rgba(0,0,0,0.7);
    padding: 12px;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="main-content">
    <h1>Feliz San Valentín,<br>mi bouyangg 💚</h1>

    <div class="grid">

        <div onclick="toggleChest(1)">
            <div id="chest1" class="chest"
            style="background-image:url('https://wallpapers.com/images/hd/minecraft_-chest_-texture-6wi209fkpk1sv5o7.png');"></div>
            <div class="chest-text">El día que nos amarramos ☠️</div>
            <div id="content1" class="content-box">Aquí empieza nuestra historia 💚</div>
        </div>

        <div onclick="toggleChest(2)">
            <div id="chest2" class="chest"
            style="background-image:url('https://wallpapers.com/images/hd/minecraft_-chest_-texture-6wi209fkpk1sv5o7.png');"></div>
            <div class="chest-text">Lo que más amo de ti 💚</div>
            <div id="content2" class="content-box">Todo lo que amo de ti es infinito 😭</div>
        </div>

    </div>
</div>

<script>

function toggleChest(num) {

    // 🔊 Reproducir sonido directamente aquí
    let sound = new Audio("click.mp3");
    sound.play();

    let chest = document.getElementById("chest"+num);
    let content = document.getElementById("content"+num);

    if (content.style.display === "block") {
        content.style.display = "none";
        chest.style.backgroundImage =
        "url('https://wallpapers.com/images/hd/minecraft_-chest_-texture-6wi209fkpk1sv5o7.png')";
    } else {
        content.style.display = "block";
        chest.style.backgroundImage =
        "url('https://p.novaskin.me/6987963180.png')";
    }
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz San Valentín</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('https://i.pinimg.com/736x/b3/c8/c1/b3c8c10c6f01b1b1bf4d26a53871976c.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
}

/* CONTENIDO PRINCIPAL (este se blurrea) */
#main {
    transition: filter 0.3s ease;
}

#main.blurred {
    filter: blur(6px);
}

.main-content {
    text-align: center;
    padding: 80px 20px;
    min-height: 100vh;
}

h1 {
    font-family: 'Press Start 2P', cursive;
    font-size: 28px;
    margin-bottom: 60px;
    text-shadow: 4px 4px 0 #000;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 60px;
    max-width: 1000px;
    margin: auto;
}

.chest {
    cursor: pointer;
    width: 130px;
    height: 130px;
    margin: auto;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    transition: transform 0.2s ease;
}

.chest:hover {
    transform: scale(1.1);
}

.chest-text {
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    margin-top: 10px;
    text-shadow: 2px 2px 0 #000;
}

/* OVERLAY */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.overlay.active {
    opacity: 1;
    pointer-events: all;
}

/* PANEL */
.panel {
    background: rgba(20,20,20,0.95);
    padding: 40px;
    border-radius: 18px;
    max-width: 650px;
    text-align: center;
    transform: scale(0.8);
    transition: transform 0.3s ease;
}

.overlay.active .panel {
    transform: scale(1);
}

.panel h2 {
    font-family: 'Press Start 2P', cursive;
    font-size: 16px;
    margin-bottom: 25px;
}

.panel p {
    line-height: 1.7;
    font-size: 15px;
    margin-bottom: 30px;
    white-space: pre-line;
}

.close-btn {
    background: #2ecc71;
    border: none;
    padding: 12px 30px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s ease;
}

.close-btn:hover {
    background: #27ae60;
}
</style>
</head>

<body>

<div id="main">

<div class="main-content">
    <h1>Feliz San Valentín,<br>mi bouyangg 💚</h1>

    <div class="grid">

        <div onclick="openCofre('dia')">
            <div class="chest" style="background-image:url('https://wallpapers.com/images/hd/minecraft_-chest_-texture-6wi209fkpk1sv5o7.png');"></div>
            <div class="chest-text">El día que nos amarramos ☠️</div>
        </div>

        <div onclick="openCofre('amo')">
            <div class="chest" style="background-image:url('https://wallpapers.com/images/hd/minecraft_-chest_-texture-6wi209fkpk1sv5o7.png');"></div>
            <div class="chest-text">Lo que más amo de ti 💚</div>
        </div>

        <div onclick="openCofre('momentos')">
            <div class="chest" style="background-image:url('https://wallpapers.com/images/hd/minecraft_-chest_-texture-6wi209fkpk1sv5o7.png');"></div>
            <div class="chest-text">Mis momentos favs contigo ✨</div>
        </div>

        <div onclick="openCofre('museo')">
            <div class="chest" style="background-image:url('https://wallpapers.com/images/hd/minecraft_-chest_-texture-6wi209fkpk1sv5o7.png');"></div>
            <div class="chest-text">Nuestro museo 🏠</div>
        </div>

        <div onclick="openCofre('canciones')">
            <div class="chest" style="background-image:url('https://wallpapers.com/images/hd/minecraft_-chest_-texture-6wi209fkpk1sv5o7.png');"></div>
            <div class="chest-text">Canciones que me recuerdan a ti 🎵</div>
        </div>

    </div>
</div>

</div>

<!-- Overlay -->
<div class="overlay" id="overlay">
    <div class="panel">
        <h2 id="panelTitle"></h2>
        <p id="panelContent"></p>
        <button class="close-btn" onclick="closeCofre()">Cerrar cofre</button>
    </div>
</div>

<script>

function openCofre(tipo) {

    document.getElementById("main").classList.add("blurred");
    document.getElementById("overlay").classList.add("active");

    const title = document.getElementById("panelTitle");
    const content = document.getElementById("panelContent");

    if(tipo === "dia"){
        title.innerText = "El día que nos amarramos ☠️";
        content.innerText =
        "Oficialmente iniciamos la partida más importante de nuestras vidas.\n\nDesde ese día supe que quería construir contigo algo real.\n\nSomos team. Somos casa. Somos futuro.";
    }

    if(tipo === "amo"){
        title.innerText = "Lo que más amo de ti 💚";
        content.innerText =
        "Amo tu humor.\nAmo tu lado romántico escondido.\nAmo cómo haces que todo sea más divertido.\n\nIncluso cuando te robas el loot… igual te elijo.";
    }

    if(tipo === "momentos"){
        title.innerText = "Mis momentos favs contigo ✨";
        content.innerText =
        "Cuando jugamos hasta tarde.\nCuando vemos atardeceres en Minecraft.\nCuando haces bromas tontas.\n\nY cualquier momento donde estés tú.";
    }

    if(tipo === "museo"){
        title.innerText = "Nuestro museo 🏠";
        content.innerText =
        "Aquí guardamos recuerdos que no caben en un cofre normal.\n\nFotos, risas y momentos que no tienen respawn.";
    }

    if(tipo === "canciones"){
        title.innerText = "Canciones que me recuerdan a ti 🎵";
        content.innerText =
        "🎵 La que me pone feliz al pensarte.\n🎵 La más sentimental.\n🎵 Te la dedico mi corazone.";
    }
}

function closeCofre(){
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("main").classList.remove("blurred");
}

</script>

</body>
</html>

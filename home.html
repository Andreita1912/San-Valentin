<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz San Valentín</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #ff9966, #ff5e62, #2c3e50);
    background-attachment: fixed;
    color: white;
    overflow-x: hidden;
}

/* Pantalla de carga */
#loading-screen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    color: #00ff64;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Press Start 2P', cursive;
    z-index: 9999;
}

.progress-bar {
    width: 300px;
    height: 20px;
    border: 3px solid #00ff64;
    margin-top: 20px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #00ff64;
}

/* Contenido principal */
.main-content {
    display: none;
    text-align: center;
    padding: 80px 20px;
    min-height: 100vh;
    backdrop-filter: blur(4px);
}

h1 {
    font-family: 'Press Start 2P', cursive;
    font-size: 26px;
    margin-bottom: 50px;
    text-shadow: 3px 3px 0 #1a1a1a;
}

/* Grid tipo inventario */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    max-width: 900px;
    margin: auto;
}

.block-button {
    background: #4c8c2b;
    border: 4px solid #2e5f18;
    padding: 25px 15px;
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 6px 6px 0 #1b3a0f;
    transition: all 0.15s ease;
}

.block-button:hover {
    transform: translate(3px,3px);
    box-shadow: 3px 3px 0 #1b3a0f;
    background: #5fae34;
}
</style>
</head>

<body>

<div id="loading-screen">
    <div>Loading world...</div>
    <div style="margin-top:15px;">Building our forever 💚</div>
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
</div>

<div class="main-content" id="main-content">
    <h1>Feliz San Valentín,<br>mi bouyangg 💚</h1>

    <div class="grid">
        <div class="block-button">El día que nos amarramos ☠️</div>
        <div class="block-button">Lo que más amo de ti 💚</div>
        <div class="block-button">Mis momentos favs contigo ✨</div>
        <div class="block-button">Nuestro museo 🏠</div>
        <div class="block-button">Canciones que me recuerdan a ti 🎵</div>
    </div>
</div>

<audio id="clickSound">
<source src="https://www.myinstants.com/media/sounds/minecraft-click.mp3" type="audio/mpeg">
</audio>

<script>
let progress = document.getElementById("progress");
let width = 0;

let interval = setInterval(function() {
    if (width >= 100) {
        clearInterval(interval);
        document.getElementById("loading-screen").style.display = "none";
        document.getElementById("main-content").style.display = "block";
        document.getElementById("clickSound").play();
    } else {
        width++;
        progress.style.width = width + "%";
    }
}, 20);
</script>

</body>
</html>

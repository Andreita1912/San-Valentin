<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso privado</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    color: white;
}

/* Corazones sutiles verdes */
body::before {
    content: "♡  ♡  ♡  ♡  ♡  ♡  ♡";
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    color: rgba(0, 255, 100, 0.2);
    font-size: 40px;
    letter-spacing: 30px;
}

body::after {
    content: "♡  ♡  ♡  ♡  ♡  ♡  ♡";
    position: absolute;
    bottom: 10%;
    width: 100%;
    text-align: center;
    color: rgba(0, 255, 100, 0.2);
    font-size: 40px;
    letter-spacing: 30px;
}

.container {
    text-align: center;
    z-index: 2;
}

h1 {
    font-weight: 300;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

input {
    padding: 12px;
    width: 200px;
    background: transparent;
    border: 1px solid #00ff64;
    color: white;
    text-align: center;
    font-size: 16px;
    outline: none;
}

button {
    margin-top: 15px;
    padding: 10px 20px;
    background: transparent;
    border: 1px solid #00ff64;
    color: #00ff64;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #00ff64;
    color: black;
}

#error {
    margin-top: 15px;
    color: #00ff64;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Solo para la persona correcta</h1>
    <input type="password" id="codeInput" placeholder="Ingresa el código">
    <br>
    <button onclick="checkCode()">Desbloquear</button>
    <div id="error"></div>
</div>

<!-- Sonido mundo Minecraft -->
<audio id="worldSound">
    <source src="https://www.myinstants.com/media/sounds/minecraft-levelup.mp3" type="audio/mpeg">
</audio>

<script>
function checkCode() {
    const code = document.getElementById("codeInput").value;
    const error = document.getElementById("error");

    if (code === "1912") {
        const sound = document.getElementById("worldSound");
        sound.play();
        
        setTimeout(() => {
            window.location.href = "home.html";
        }, 1500);

    } else {
        error.textContent = "Tas en nada, fuera de aquí";
    }
}
</script>

</body>
</html>
